<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Classmate System</title>

    <style>

        body {
            background-color: #5B7E3C;
            font-family: Arial;
            margin:0;
            color:white;
        }


        .navbar{
            background:#A2CB8B;
            padding:18px 40px;

            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            align-items:center;

            border-bottom:2px solid #1d7a31;
            box-shadow:0 2px 10px black;
        }


        .logo{
            font-size:28px;
            font-weight:bold;
            color:#8dffab;
        }


        .nav-links{
            display:flex;
            justify-content:center;
            gap:30px;
        }

        .nav-links a{
            text-decoration:none;
            color:white;
            font-weight:bold;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#8dffab;
        }


        .search-box{
            display:flex;
            justify-content:flex-end;
        }

        .search-box input{
            padding:10px 15px;
            border-radius:25px;
            border:none;

            width:220px;

            outline:none;
            background:#5B7E3C;
            color:white;
        }

        .search-box input::placeholder{
            color:#d8ffe2;
        }


        .title{
            text-align:center;
            margin-top:40px;
        }

        .title h2{
            font-size:40px;
            margin-bottom:10px;
        }

        .title p{
            font-size:18px;
            color:#d8ffe2;
        }


        .container-box {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: rgb(192, 243, 209);
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgb(41, 36, 36);

            color:black;
        }

        #output {
            margin-top: 20px;
            text-align: left;
        }

        .btn-primary{
            background:#155e22;
            border:none;
        }

        .btn-success{
            background:#1d7a31;
            border:none;
        }

    </style>
</head>

<body>


    <div class="navbar">

        <div class="logo">
            10-Ruby
        </div>

        <div class="nav-links">
            <a href="http://127.0.0.1:5500/pic.html">Home</a>
            <a href="http://127.0.0.1:5500/sw.html">Gallery</a>
            <a href="http://127.0.0.1:5500/sk.html">Tracker</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search classmates...">
        </div>

    </div>



    <div class="title">

        <h2>Grade 10 Classmates System 🎓</h2>

        <p>
            Add and view your classmates easily!
        </p>

    </div>




    <div class="container-box">

        <input id="name" class="form-control mb-2" placeholder="Name">

        <input id="section" class="form-control mb-2" placeholder="Section">

        <input id="subject" class="form-control mb-3" placeholder="Favorite Subject">

        <button class="btn btn-primary w-100 mb-2" py-click="add">
            Add Classmate
        </button>

        <button class="btn btn-success w-100" py-click="show">
            Show List
        </button>

    </div>



    <div class="container-box">

        <h5>Classmate List</h5>

        <p id="output"></p>

    </div>

<py-script src="sw.py"></py-script>

</body>
</html>
